name: Hackear Servidor Oracle (4 OCPU / 24 GB)

on:
  schedule:
    # Intenta arrancar un nuevo ciclo cada 4 o 5 horas
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite lanzarlo manualmente cuando quieras

# Evita que se solapen dos ejecuciones a la vez
concurrency:
  group: oracle-hunter
  cancel-in-progress: false

jobs:
  intentar_creacion:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # Límite de seguridad de 5.5 horas
    steps:
      - name: Instalar OCI CLI
        run: |
          pipx install oci-cli

      - name: Configurar credenciales OCI
        env:
          KEY_DATA: ${{ secrets.OCI_KEY_FILE }}
        run: |
          mkdir -p ~/.oci
          echo "$KEY_DATA" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF
          chmod 600 ~/.oci/config

      - name: Verificar autenticación con Oracle
        run: |
          oci os ns get

      - name: Reintentos continuos (5 Horas)
        run: |
          STACK_ID="${{ secrets.OCI_STACK_ID }}"
          echo "Iniciando peticiones sobre el Stack: $STACK_ID"

          # 18,000 segundos = 5 horas seguidas de intentos
          TIEMPO_LIMITE=$((SECONDS + 18000))

          while [ $SECONDS -lt $TIEMPO_LIMITE ]; do
            HORA=$(date '+%H:%M:%S')

            RESPUESTA=$(oci resource-manager job create-apply-job \
              --stack-id "$STACK_ID" \
              --execution-plan-strategy AUTO_APPROVED 2>&1 || true)

            JOB_ID=$(echo "$RESPUESTA" | jq -r '.data.id // empty' 2>/dev/null || true)

            if [ -n "$JOB_ID" ]; then
              echo "[$HORA] Job en proceso ($JOB_ID). Evaluando capacidad física..."
              sleep 40
              ESTADO=$(oci resource-manager job get --job-id "$JOB_ID" --query "data.\"lifecycle-state\"" --raw-output 2>/dev/null || true)

              if [ "$ESTADO" = "SUCCEEDED" ]; then
                echo "=========================================================="
                echo "[$HORA] ¡ÉXITO TOTAL! Instancia 4 OCPU / 24 GB aprovisionada."
                echo "=========================================================="
                exit 0
              else
                echo "[$HORA] Capacidad aún agotada. Esperando 60 segundos..."
                sleep 60
              fi
            elif echo "$RESPUESTA" | grep -q "TooManyRequests"; then
              echo "[$HORA] Rate limit temporal alcanzado (429). Enfriando API durante 90 segundos..."
              sleep 90
            else
              echo "[$HORA] Respuesta de Oracle:"
              echo "$RESPUESTA"
              echo "Reintentando en 60 segundos..."
              sleep 60
            fi
          done
