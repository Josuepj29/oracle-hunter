name: Cazar Servidor Oracle (4 OCPU / 24 GB)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  intentar_creacion:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar OCI CLI
        run: |
          pipx install oci-cli

      - name: Configurar credenciales OCI
        env:
          KEY_DATA: ${{ secrets.OCI_KEY_FILE }}
        run: |
          mkdir -p ~/.oci
          echo "$KEY_DATA" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF

      - name: Verificar autenticación con Oracle
        run: |
          echo "Comprobando conexión y llaves..."
          oci os ns get

      - name: Reintentos de captura
        run: |
          STACK_ID="${{ secrets.OCI_STACK_ID }}"
          echo "Iniciando peticiones sobre el Stack: $STACK_ID"

          TIEMPO_LIMITE=$((SECONDS + 1500))

          while [ $SECONDS -lt $TIEMPO_LIMITE ]; do
            HORA=$(date '+%H:%M:%S')
            
            # Lanzamos el job capturando la respuesta real
            RESPUESTA=$(oci resource-manager job create-apply-job \
              --stack-id "$STACK_ID" \
              --execution-plan-strategy AUTO_APPROVED 2>&1 || true)
            
            JOB_ID=$(echo "$RESPUESTA" | jq -r '.data.id // empty' 2>/dev/null || true)

            if [ -n "$JOB_ID" ]; then
              echo "[$HORA] Job enviado con éxito: $JOB_ID. Verificando disponibilidad física..."
              sleep 35
              ESTADO=$(oci resource-manager job get --job-id "$JOB_ID" --query "data.\"lifecycle-state\"" --raw-output 2>/dev/null || true)

              if [ "$ESTADO" = "SUCCEEDED" ]; then
                echo "=========================================================="
                echo "[$HORA] ¡ÉXITO TOTAL! Servidor 4 OCPU / 24 GB creado."
                echo "=========================================================="
                exit 0
              else
                echo "[$HORA] Capacidad llena. Reintentando en 25 segundos..."
              fi
            else
              echo "[$HORA] Detalle de respuesta de Oracle:"
              echo "$RESPUESTA"
              echo "Reintentando en 30 segundos..."
            fi
            sleep 25
          done
